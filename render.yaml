services:
  - type: web
    name: susbiome-frontend
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_SUSBIOME_API_BASE
        value: https://dashboard.susbiome.com
  - type: web
    name: susbiome-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SUSBIOME_ENV
        value: production
      - key: SUSBIOME_ALLOWED_HOSTS
        value: susbiome-api.onrender.com,dashboard.susbiome.com,api.susbiome.com,localhost,127.0.0.1
      - key: SUSBIOME_CORS_ORIGINS
        value: https://susbiome-frontend.onrender.com,https://susbiome.com,https://www.susbiome.com,https://dashboard.susbiome.com
      - key: SUSBIOME_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: SUSBIOME_CONTACT_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: SUSBIOME_MAX_REQUEST_BYTES
        value: "1048576"
      - key: SUSBIOME_SMTP_HOST
        value: smtp.gmail.com
      - key: SUSBIOME_SMTP_PORT
        value: "587"
      - key: SUSBIOME_SMTP_USERNAME
        value: susbiome098@gmail.com
      - key: SUSBIOME_SMTP_PASSWORD
        sync: false
      - key: SUSBIOME_SMTP_USE_SSL
        value: "false"
      - key: SUSBIOME_CONTACT_FROM
        value: susbiome098@gmail.com
      - key: SUSBIOME_CONTACT_TO
        value: susbiome098@gmail.com
